name: AppImage

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential  \
            cmake            \
            curl             \
            file             \
            fuse             \
            git              \
            make             \
            libx11-dev       \
            libxrandr-dev    \
            libxcursor-dev   \
            libxi-dev        \
            libudev-dev      \
            libgl-dev        \
            libmbedtls-dev   \
            libssh2-1-dev    \
            libfreetype-dev  \
            libharfbuzz-dev  \
            libvorbis-dev    \
            libflac-dev

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Mark repo directory as safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Create build directory
        run: mkdir build

      - name: Build AppImage
        working-directory: build
        run: |
          sh ../packaging/appimage/build_appimage.sh

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: appimage
          path: build/haldanoti*.AppImage
          if-no-files-found: error
